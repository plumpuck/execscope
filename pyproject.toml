[project]
name = "execscope"
version = "0.2.0"
description = "Execution-quality TCA and backtest-fidelity workbench on NautilusTrader"
requires-python = ">=3.12"
dependencies = ["pandas"]

[project.optional-dependencies]
backtest = ["nautilus_trader"]
dev = ["pytest", "hypothesis", "ruff", "mypy"]
service = ["fastapi", "uvicorn", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
