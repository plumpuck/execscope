[project]
name = "execscope"
version = "0.2.0"
description = "Execution-quality TCA and backtest-fidelity workbench on NautilusTrader"
requires-python = ">=3.12"
dependencies = ["pandas"]

[project.optional-dependencies]
backtest = ["nautilus_trader"]
dev = ["pytest", "hypothesis", "ruff", "mypy"]
service = ["fastapi", "uvicorn", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "execscope.backtest.runner.AlgoSpec", "execscope.backtest.runner.VenueSettings"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src"]
